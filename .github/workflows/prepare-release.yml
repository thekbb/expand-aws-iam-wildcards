name: Prepare Release
run-name: Prepare v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver release version without a leading v
        required: true
        type: string
      finalize_changelog:
        description: Finalize CHANGELOG.md with the requested release version
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prepare-release-v${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    environment:
      name: automation
    steps:
      - name: Validate requested release version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected version input like 1.2.3"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: main

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.14.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Report locked IAM data
        id: iam_data
        run: npm run release:report-iam-data

      - name: Lint
        run: npm run lint

      - name: Finalize changelog
        if: inputs.finalize_changelog
        env:
          VERSION: ${{ inputs.version }}
        run: npm run release -- "$VERSION" --finalize-changelog

      - name: Lint Markdown
        run: npm run lint:md

      - name: Check documentation contracts
        run: npm run docs:check

      - name: Type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test -- --coverage

      - name: Update package version
        env:
          VERSION: ${{ inputs.version }}
        run: npm version --no-git-tag-version "$VERSION"

      - name: Build action bundle on Linux
        run: npm run build

      - name: Create or update the release preparation branch
        env:
          GH_TOKEN: ${{ secrets.IAM_UPDATE_PAT }}
          IAM_ACTION_COUNT: ${{ steps.iam_data.outputs.action_count }}
          IAM_DATA_VERSION: ${{ steps.iam_data.outputs.version }}
          IAM_SERVICE_COUNT: ${{ steps.iam_data.outputs.service_count }}
          VERSION: ${{ inputs.version }}
        run: |
          BRANCH="release-candidate/v${VERSION}"
          BODY="Uses locked IAM data ${IAM_DATA_VERSION} with ${IAM_ACTION_COUNT} actions across ${IAM_SERVICE_COUNT} services, generates the release bundle on Ubuntu, and updates package metadata for v${VERSION}."
          git switch -c "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md package.json package-lock.json dist/index.js

          if git diff --cached --quiet; then
            echo "No release preparation changes were generated."
            exit 1
          fi

          git commit -m "Prepare v${VERSION} release"
          git push --force-with-lease "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${BRANCH}"

          pr_number="$(gh pr list --head "$BRANCH" --base main --json number --jq '.[0].number // empty')"
          if [[ -n "$pr_number" ]]; then
            gh pr edit "$pr_number" --body "$BODY"
            echo "Updated existing release preparation PR #$pr_number"
            exit 0
          fi

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Prepare v${VERSION} release" \
            --body "$BODY"
