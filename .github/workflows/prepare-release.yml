name: Prepare Release
run-name: Prepare v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver release version without a leading v
        required: true
        type: string
      finalize_changelog:
        description: Finalize CHANGELOG.md with the requested release version
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: prepare-release-v${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: automation
    steps:
      - name: Validate requested release version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected version input like 1.2.3"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: main

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Report locked IAM data
        id: iam_data
        run: npm run release:report-iam-data

      - name: Lint
        run: npm run lint

      - name: Finalize changelog
        if: inputs.finalize_changelog
        env:
          VERSION: ${{ inputs.version }}
        run: npm run release -- "$VERSION" --finalize-changelog

      - name: Lint Markdown
        run: npm run lint:md

      - name: Check documentation contracts
        run: npm run docs:check

      - name: Type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:coverage

      - name: Update package version
        env:
          VERSION: ${{ inputs.version }}
        run: npm version --no-git-tag-version "$VERSION"

      - name: Build action bundle on Linux
        run: npm run build

      - name: Check release-managed files
        run: npm run release:check-files

      - name: Create or update the release preparation pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.IAM_UPDATE_PAT }}
          base: main
          branch: release-candidate/v${{ inputs.version }}
          delete-branch: true
          title: Prepare v${{ inputs.version }} release
          commit-message: Prepare v${{ inputs.version }} release
          body: |
            Uses locked [`@cloud-copilot/iam-data@${{ steps.iam_data.outputs.version }}`](https://www.npmjs.com/package/@cloud-copilot/iam-data/v/${{ steps.iam_data.outputs.version }}) with
            `${{ steps.iam_data.outputs.action_count }}` actions across
            `${{ steps.iam_data.outputs.service_count }}` services, generates
            the release bundle on Ubuntu, and updates package metadata for
            `v${{ inputs.version }}`.
          add-paths: |
            CHANGELOG.md
            dist/index.js
            package-lock.json
            package.json
